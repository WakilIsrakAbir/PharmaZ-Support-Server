$kind: http-request
method: GET
url: '{{base_url}}/calls?limit=500&status=done'
order: 6000
queryParams:
  - key: limit
    value: '500'
  - key: status
    value: done
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad filters", () => {
        pm.expect(pm.response.json().error.fields).to.have.all.keys("limit", "status");
      });
