$kind: http-request
method: GET
url: '{{base_url}}/calls?search=%2B880%201712'
order: 5100
queryParams:
  - key: search
    value: '%2B880%201712'
    description: Part of a mobile number, typed the way a person would
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("finds the call that was just logged", () => {
        const ids = pm.response.json().data.map((call) => call.id);
        pm.expect(ids).to.include(pm.collectionVariables.get("call_id"));
      });
      pm.test("every result has that number in it", () => {
        pm.response.json().data.forEach((call) => pm.expect(call.mobile).to.include("01712"));
      });
