$kind: http-request
method: GET
url: '{{base_url}}/calls/{{call_id}}'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("returns the requested call", () => {
        const call = pm.response.json().data;
        pm.expect(call.id).to.eql(pm.collectionVariables.get("call_id"));
        pm.expect(call.mobile).to.eql("01712345678");
      });
