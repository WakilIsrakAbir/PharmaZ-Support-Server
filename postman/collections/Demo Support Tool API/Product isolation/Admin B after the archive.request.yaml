$kind: http-request
method: GET
url: '{{base_url}}/product/setup'
order: 2600
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("says the product was archived", () => {
        const { error } = pm.response.json();
        pm.expect(error.message).to.include("archived");
        pm.expect(error.fields).to.eql({ product: "none" });
      });
