$kind: http-request
method: GET
url: '{{base_url}}/calls/{{call_id}}'
order: 1400
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 404", () => pm.response.to.have.status(404));
      pm.test("doesn't reveal that the call exists", () => pm.expect(pm.response.json().error.message).to.eql("Call not found"));
