$kind: http-request
method: PATCH
url: '{{base_url}}/product/areas/{{area_id}}'
order: 1600
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin_b'
body:
  type: json
  content: |-
    {
      "isActive": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 404", () => pm.response.to.have.status(404));
