$kind: http-request
method: PATCH
url: '{{base_url}}/users/{{b_agent_id}}'
order: 1900
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin_b'
body:
  type: json
  content: |-
    {
      "role": "admin"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("only the super admin can", () => pm.expect(pm.response.json().error.message).to.eql("Only the super admin can do this."));
