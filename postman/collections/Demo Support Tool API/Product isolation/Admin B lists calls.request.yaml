$kind: http-request
method: GET
url: '{{base_url}}/calls'
order: 1500
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("sees none of PharmaZ247's calls", () => {
        const { data, meta } = pm.response.json();
        pm.expect(meta.total).to.eql(0);
        pm.expect(data).to.eql([]);
      });
