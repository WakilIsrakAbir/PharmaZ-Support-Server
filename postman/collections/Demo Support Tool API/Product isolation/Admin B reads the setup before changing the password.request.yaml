$kind: http-request
method: GET
url: '{{base_url}}/product/setup'
order: 1100
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("asks for a new password", () => pm.expect(pm.response.json().error.fields).to.eql({ password: "change" }));
