$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{admin_b_email}}",
      "password": "{{admin_b_temp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("must change the password first", () => pm.expect(pm.response.json().data.mustChangePassword).to.eql(true));
      pm.collectionVariables.set("admin_b_token", pm.response.headers.get("Set-Cookie").match(/token=([^;]+)/)[1]);
