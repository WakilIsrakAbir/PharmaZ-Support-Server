$kind: http-request
method: PATCH
url: '{{base_url}}/auth/me/password'
order: 1200
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin_b'
body:
  type: json
  content: |-
    {
      "currentPassword": "{{admin_b_temp}}",
      "newPassword": "admin-b-password-1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("admin_b_token", pm.response.headers.get("Set-Cookie").match(/token=([^;]+)/)[1]);
