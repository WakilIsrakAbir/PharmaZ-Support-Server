$kind: http-request
method: GET
url: '{{base_url}}/admin/products'
order: 2100
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("it's for the super admin", () => pm.expect(pm.response.json().error.message).to.eql("Only the super admin can do this."));
