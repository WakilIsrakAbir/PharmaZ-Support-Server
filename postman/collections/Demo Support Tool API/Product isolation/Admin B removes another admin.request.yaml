$kind: http-request
method: DELETE
url: '{{base_url}}/users/{{second_admin_id}}'
order: 1950
headers:
  - key: X-Send-As
    value: 'admin_b'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("only the super admin can", () => pm.expect(pm.response.json().error.message).to.eql("Only the super admin can remove an admin."));
