$kind: http-request
method: PATCH
url: '{{base_url}}/admin/products/{{product_b_id}}'
order: 2500
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "isArchived": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("it's archived", () => pm.expect(pm.response.json().data.isArchived).to.eql(true));
