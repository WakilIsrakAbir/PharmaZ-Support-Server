$kind: http-request
method: POST
url: '{{base_url}}/auth/forgot-password'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 204", () => pm.response.to.have.status(204));
