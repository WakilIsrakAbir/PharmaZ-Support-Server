$kind: http-request
method: POST
url: '{{base_url}}/auth/forgot-password'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody.{{$timestamp}}@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("answers exactly like a real account, with 204", () => pm.response.to.have.status(204));
