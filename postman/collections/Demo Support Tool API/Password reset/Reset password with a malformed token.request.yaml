$kind: http-request
method: POST
url: '{{base_url}}/auth/reset-password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "abc",
      "password": "whatever-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("points at the token", () => {
        pm.expect(pm.response.json().error.fields.token).to.eql("This reset link is invalid.");
      });
