$kind: http-request
method: GET
url: '{{base_url}}/auth/me'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 401", () => pm.response.to.have.status(401));
      pm.test("asks the user to log in", () => {
        pm.expect(pm.response.json().error.message).to.eql("Please log in to continue.");
      });
