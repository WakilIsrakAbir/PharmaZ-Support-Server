$kind: http-request
method: GET
url: '{{base_url}}/auth/me'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("is still the same user", () => {
        pm.expect(pm.response.json().data.email).to.eql(pm.collectionVariables.get("email"));
      });
