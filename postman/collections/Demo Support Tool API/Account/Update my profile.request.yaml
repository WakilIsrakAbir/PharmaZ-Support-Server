$kind: http-request
method: PATCH
url: '{{base_url}}/auth/me'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "  Renamed Agent  ",
      "email": "{{email}}",
      "phone": "01712-345678"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("saves the new details", () => {
        const user = pm.response.json().data;
        pm.expect(user.name).to.eql("Renamed Agent");
        pm.expect(user.phone).to.eql("01712-345678");
      });
      pm.test("includes the account dates", () => {
        const user = pm.response.json().data;
        pm.expect(user).to.have.property("createdAt");
        pm.expect(user).to.have.property("lastLoginAt");
      });
      pm.test("never exposes secrets", () => {
        pm.expect(pm.response.json().data).to.not.have.any.keys("passwordHash", "resetTokenHash", "sessionVersion");
      });
