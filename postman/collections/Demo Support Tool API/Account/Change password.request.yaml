$kind: http-request
method: PATCH
url: '{{base_url}}/auth/me/password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "brand-new-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("records when the password changed", () => {
        pm.expect(pm.response.json().data).to.have.property("passwordChangedAt");
      });
      pm.test("gives this session a fresh token cookie", () => {
        const cookie = pm.response.headers.get("Set-Cookie");
        pm.expect(cookie).to.include("token=");
        // Keep the old one to prove it no longer works
        pm.collectionVariables.set("old_token", pm.collectionVariables.get("token"));
        pm.collectionVariables.set("token", cookie.match(/token=([^;]+)/)[1]);
        pm.collectionVariables.set("password", "brand-new-password");
      });
