$kind: http-request
method: PATCH
url: '{{base_url}}/auth/me/password'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "not-my-password",
      "newPassword": "brand-new-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("points at the current password field", () => {
        pm.expect(pm.response.json().error.fields.currentPassword).to.eql("Your current password is incorrect.");
      });
