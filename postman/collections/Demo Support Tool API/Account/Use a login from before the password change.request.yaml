$kind: http-request
method: GET
url: '{{base_url}}/auth/me'
order: 5000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Act like another device that logged in before the change
      pm.request.headers.upsert({ key: "Cookie", value: `token=${pm.collectionVariables.get("old_token")}` });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 401", () => pm.response.to.have.status(401));
