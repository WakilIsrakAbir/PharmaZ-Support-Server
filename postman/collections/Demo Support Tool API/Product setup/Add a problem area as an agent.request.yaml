$kind: http-request
method: POST
url: '{{base_url}}/product/areas'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Agent's own area"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
