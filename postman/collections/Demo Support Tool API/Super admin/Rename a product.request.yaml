$kind: http-request
method: PATCH
url: '{{base_url}}/admin/products/{{product_b_id}}'
order: 1800
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "name": "Clinic Desk {{run}} Pro",
      "accentColor": "rose"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("saves the new name and colour, keeps the slug", () => {
        const product = pm.response.json().data;
        pm.expect(product).to.include({ name: `Clinic Desk ${pm.collectionVariables.get("run")} Pro`, accentColor: "rose" });
        pm.expect(product.slug).to.eql(`clinic-desk-${pm.collectionVariables.get("run")}`);
      });
