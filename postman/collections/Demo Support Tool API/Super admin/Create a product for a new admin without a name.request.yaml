$kind: http-request
method: POST
url: '{{base_url}}/admin/products'
order: 1300
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "name": "Never Made {{run}}",
      "admin": {
        "email": "ghost.{{run}}@example.com"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("asks for the admin's name", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("admin.name"));
