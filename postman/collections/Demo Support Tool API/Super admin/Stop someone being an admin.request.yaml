$kind: http-request
method: DELETE
url: '{{base_url}}/admin/products/{{product_b_id}}/admins/{{second_admin_id}}'
order: 1700
headers:
  - key: X-Send-As
    value: 'admin'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("they stay in the product as an agent", () => {
        pm.expect(pm.response.json().data).to.include({ adminCount: 1, agentCount: 1 });
      });
