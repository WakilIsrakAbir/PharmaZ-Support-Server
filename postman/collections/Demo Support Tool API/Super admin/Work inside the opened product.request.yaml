$kind: http-request
method: GET
url: '{{base_url}}/product/setup'
order: 2200
headers:
  - key: X-Send-As
    value: 'admin'
  - key: X-Product
    value: '{{product_b_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("the setup is product B's, which starts empty", () => {
        const { product, areas, statuses } = pm.response.json().data;
        pm.expect(product.id).to.eql(pm.collectionVariables.get("product_b_id"));
        pm.expect(areas).to.eql([]);
        pm.expect(statuses.map((status) => status.key)).to.eql(["completed", "pending", "resolved", "under-review"]);
      });
