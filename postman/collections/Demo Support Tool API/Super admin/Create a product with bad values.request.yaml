$kind: http-request
method: POST
url: '{{base_url}}/admin/products'
order: 1400
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "name": " ",
      "accentColor": "plaid",
      "admin": {
        "email": "not-an-email"
      },
      "plan": "gold"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("name", "accentColor", "admin.email", "plan"));
