$kind: http-request
method: POST
url: '{{base_url}}/admin/products'
order: 1200
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "name": "Never Made {{run}}",
      "admin": {
        "name": "Test Agent",
        "email": "{{email}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 409", () => pm.response.to.have.status(409));
      pm.test("names the admin's email", () => {
        pm.expect(pm.response.json().error.fields).to.eql({ "admin.email": "This person already belongs to another product." });
      });
