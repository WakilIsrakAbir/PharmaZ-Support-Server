$kind: http-request
method: GET
url: '{{base_url}}/admin/products/options'
order: 1500
description: The product picker's list. Only active products, with just what's needed to pick one.
headers:
  - key: X-Send-As
    value: 'admin'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      const { data } = pm.response.json();
      pm.test("lists PharmaZ247", () => pm.expect(data.map((product) => product.id)).to.include(pm.collectionVariables.get("pharmaz_id")));
      pm.test("only active products, names and colours", () => {
        data.forEach((product) => {
          pm.expect(product).to.have.all.keys("id", "name", "slug", "accentColor", "isArchived");
          pm.expect(product.isArchived).to.eql(false);
        });
      });
