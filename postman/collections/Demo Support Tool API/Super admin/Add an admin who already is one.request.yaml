$kind: http-request
method: POST
url: '{{base_url}}/admin/products/{{product_b_id}}/admins'
order: 1600
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "email": "second.{{run}}@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 409", () => pm.response.to.have.status(409));
      pm.test("says so", () => pm.expect(pm.response.json().error.fields.email).to.eql("This person is already an admin of this product."));
