$kind: http-request
method: GET
url: '{{base_url}}/auth/me'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      const user = pm.response.json().data;
      pm.test("returns the logged-in user", () => {
        pm.expect(user).to.include({ email: pm.collectionVariables.get("email"), name: "Test Agent", role: "agent" });
        pm.expect(user).to.include({ isSuperAdmin: false, mustChangePassword: false });
      });
      pm.test("includes the product they work in", () => {
        pm.expect(user.product).to.include.keys("id", "name", "slug", "accentColor");
        pm.collectionVariables.set("pharmaz_id", user.product.id);
      });
