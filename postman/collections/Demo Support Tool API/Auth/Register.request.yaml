$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Agent",
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // A new address every run, so the collection can be run again and again
      pm.collectionVariables.set("email", `test.agent.${Date.now()}@example.com`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 201", () => pm.response.to.have.status(201));
      pm.test("returns the new user without the password", () => {
        const user = pm.response.json().data;
        pm.expect(user.email).to.eql(pm.collectionVariables.get("email"));
        pm.expect(user.role).to.eql("agent");
        pm.expect(user).to.have.property("id");
        pm.expect(user).to.not.have.any.keys("passwordHash", "password", "_id");
      });
      pm.test("sets an httpOnly token cookie", () => {
        const cookie = pm.response.headers.get("Set-Cookie");
        pm.expect(cookie).to.include("token=");
        pm.expect(cookie).to.include("HttpOnly");
        pm.collectionVariables.set("token", cookie.match(/token=([^;]+)/)[1]);
      });
