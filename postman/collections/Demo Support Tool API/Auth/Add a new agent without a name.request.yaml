$kind: http-request
method: POST
url: '{{base_url}}/users'
order: 1500
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "email": "nobody.{{$timestamp}}@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("asks for their name", () => pm.expect(pm.response.json().error.fields.name).to.include("Enter their name."));
