$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 4000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "not-the-password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 401", () => pm.response.to.have.status(401));
      pm.test("doesn't say whether the email exists", () => {
        pm.expect(pm.response.json().error.message).to.eql("Incorrect email or password.");
      });
