$kind: http-request
method: POST
url: '{{base_url}}/users'
order: 1400
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Send-As
    value: 'admin'
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 409", () => pm.response.to.have.status(409));
      pm.test("says so", () => pm.expect(pm.response.json().error.fields.email).to.eql("This person is already in this product."));
