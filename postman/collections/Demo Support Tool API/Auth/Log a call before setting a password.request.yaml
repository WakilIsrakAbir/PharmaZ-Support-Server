$kind: http-request
method: GET
url: '{{base_url}}/calls'
order: 1200
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
      pm.test("asks for a new password first", () => {
        const { error } = pm.response.json();
        pm.expect(error.message).to.eql("Set a new password before you continue.");
        pm.expect(error.fields).to.eql({ password: "change" });
      });
