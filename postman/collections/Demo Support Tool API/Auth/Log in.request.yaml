$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "  {{email}}  ",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("accepts the email with extra spaces", () => {
        pm.expect(pm.response.json().data.email).to.eql(pm.collectionVariables.get("email"));
      });
      pm.test("sets the token cookie", () => {
        const cookie = pm.response.headers.get("Set-Cookie");
        pm.expect(cookie).to.include("token=");
        pm.collectionVariables.set("token", cookie.match(/token=([^;]+)/)[1]);
      });
