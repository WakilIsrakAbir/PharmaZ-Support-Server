$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 1100
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{temporary_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("says the password must be changed", () => pm.expect(pm.response.json().data.mustChangePassword).to.eql(true));
      pm.test("sets an httpOnly token cookie", () => {
        const cookie = pm.response.headers.get("Set-Cookie");
        pm.expect(cookie).to.include("token=").and.include("HttpOnly");
      });
      pm.collectionVariables.set("token", pm.response.headers.get("Set-Cookie").match(/token=([^;]+)/)[1]);
