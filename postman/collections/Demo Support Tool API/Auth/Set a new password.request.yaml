$kind: http-request
method: PATCH
url: '{{base_url}}/auth/me/password'
order: 1300
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "currentPassword": "{{temporary_password}}",
      "newPassword": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("no longer needs a new password", () => pm.expect(pm.response.json().data.mustChangePassword).to.eql(false));
      pm.collectionVariables.set("token", pm.response.headers.get("Set-Cookie").match(/token=([^;]+)/)[1]);
