$kind: http-request
method: GET
url: '{{base_url}}/performance?from=2026-02-31&to=2026-01-01&agents=nope'
order: 4000
headers:
  - key: X-Send-As
    value: 'admin'
  - key: X-Product
    value: '{{pharmaz_id}}'
queryParams:
  - key: from
    value: '2026-02-31'
  - key: to
    value: '2026-01-01'
  - key: agents
    value: 'nope'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("from", "agents"));
