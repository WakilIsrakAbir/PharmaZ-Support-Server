$kind: http-request
method: PUT
url: '{{base_url}}/product/custom-fields'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customFields": {{fields_body}}
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Reuse the keys of fields from earlier runs, so the run works on any database
      const saved = JSON.parse(pm.collectionVariables.get("setup_json")).customFields;
      const keyOf = (label) => saved.find((field) => field.label === label)?.key;
      const fields = [
        { label: "Branch", type: "select", options: ["Dhaka", "Chittagong"], required: true },
        { label: "Invoice amount", type: "number" },
        { label: "Visit date", type: "date" },
      ].map((field) => ({ ...(keyOf(field.label) && { key: keyOf(field.label) }), ...field, isActive: true }));
      pm.collectionVariables.set("fields_body", JSON.stringify(fields));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      const setup = pm.response.json().data;
      pm.collectionVariables.set("setup_json", JSON.stringify(setup));
      const active = setup.customFields.filter((field) => field.isActive);
      pm.test("saves the fields with keys made from their names", () => {
        pm.expect(active.map((field) => field.key)).to.eql(["branch", "invoice-amount", "visit-date"]);
        pm.expect(active[0]).to.include({ type: "select", required: true });
        pm.expect(active[0].options).to.eql(["Dhaka", "Chittagong"]);
      });
