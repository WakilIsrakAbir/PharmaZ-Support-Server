$kind: http-request
method: PATCH
url: '{{base_url}}/product'
order: 4100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "accentColor": "plaid",
      "slug": "taken-over"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("accentColor", "slug"));
