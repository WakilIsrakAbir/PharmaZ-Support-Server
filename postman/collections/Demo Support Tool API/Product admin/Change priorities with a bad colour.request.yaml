$kind: http-request
method: PUT
url: '{{base_url}}/product/priorities'
order: 2800
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "priorities": [
        {
          "label": "Low",
          "color": "plaid"
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("priorities.0.color"));
