$kind: http-request
method: POST
url: '{{base_url}}/product/areas'
order: 1200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "  ",
      "icon": "unicorn",
      "colour": "red"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("name", "icon", "colour"));
