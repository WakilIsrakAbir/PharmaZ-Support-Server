$kind: http-request
method: PATCH
url: '{{base_url}}/calls/{{admin_call_id}}'
order: 3400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "completed"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("isn't blocked by the new required field", () => pm.expect(pm.response.json().data.status).to.eql("completed"));
