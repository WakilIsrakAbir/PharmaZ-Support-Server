$kind: http-request
method: PATCH
url: '{{base_url}}/calls/{{fields_call_id}}'
order: 3350
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customFields": {
        "branch": "Chittagong",
        "visit-date": null
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("changes the given answers, clears null ones and keeps the rest", () => {
        pm.expect(pm.response.json().data.customFields).to.eql({ branch: "Chittagong", "invoice-amount": 1250.5 });
      });
