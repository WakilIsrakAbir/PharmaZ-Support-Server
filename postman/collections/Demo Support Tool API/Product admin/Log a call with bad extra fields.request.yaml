$kind: http-request
method: POST
url: '{{base_url}}/calls'
order: 3200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mobile": "01812345678",
      "customFields": {
        "branch": "Sylhet",
        "invoice-amount": "lots",
        "visit-date": "yesterday",
        "colour": "red"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("customFields.branch", "customFields.invoice-amount", "customFields.visit-date", "customFields.colour"));
      pm.test("says what's wrong with each", () => {
        const { fields } = pm.response.json().error;
        pm.expect(fields["customFields.branch"]).to.eql("Pick one of the options for Branch.");
        pm.expect(fields["customFields.colour"]).to.eql("Unknown field.");
      });
