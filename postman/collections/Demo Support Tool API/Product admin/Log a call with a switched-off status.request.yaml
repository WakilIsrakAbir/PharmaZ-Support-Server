$kind: http-request
method: POST
url: '{{base_url}}/calls'
order: 2300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mobile": "01812345678",
      "status": "escalated",
      "priority": "sky-high"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the bad fields", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("status", "priority"));
