$kind: http-request
method: POST
url: '{{base_url}}/calls'
order: 3300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mobile": "01812345678",
      "customFields": {
        "invoice-amount": 10
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names the required field", () => {
        pm.expect(pm.response.json().error.fields).to.eql({ "customFields.branch": "Branch is required." });
      });
