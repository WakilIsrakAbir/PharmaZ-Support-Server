$kind: http-request
method: PATCH
url: '{{base_url}}/product'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "  Pharmacy management system  "
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("saves the trimmed description", () => {
        pm.expect(pm.response.json().data.product.description).to.eql("Pharmacy management system");
      });
