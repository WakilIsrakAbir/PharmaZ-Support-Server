$kind: http-request
method: PUT
url: '{{base_url}}/product/custom-fields'
order: 3500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customFields": [
        {
          "key": "branch",
          "label": "Branch",
          "type": "text"
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("explains why", () => {
        pm.expect(pm.response.json().error.message).to.eql('"Branch" already has answers, so its type can\'t change. Add a new field instead.');
      });
