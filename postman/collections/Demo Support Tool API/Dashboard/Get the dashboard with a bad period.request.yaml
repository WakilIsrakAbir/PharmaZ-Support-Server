$kind: http-request
method: GET
url: '{{base_url}}/dashboard?days=12&tz=5000'
order: 2000
queryParams:
  - key: days
    value: '12'
  - key: tz
    value: '5000'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400));
      pm.test("names both", () => pm.expect(pm.response.json().error.fields).to.have.all.keys("days", "tz"));
