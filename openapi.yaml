openapi: 3.1.0
info:
  title: Demo Support Tool API
  version: 1.0.0
  description: |
    Backend for the PharmaZ247 support tool. Agents log customer calls here,
    and the Logs, QA and Performance pages read them back.

    Every error response uses the same shape:
    `{ "error": { "message": "...", "fields": { "<field>": "<why>" } } }`
    (`fields` only appears on validation errors).
servers:
  - url: http://localhost:5000/api
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Calls

# Logged-in users carry an httpOnly `token` cookie, set by register/login.
security:
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and log in
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
            example: { name: Wakil Israk Abir, email: abir@example.com, password: a-long-password }
      responses:
        "201":
          description: Account created. The response sets the `token` cookie.
          headers:
            Set-Cookie: { schema: { type: string }, description: "token=...; HttpOnly; SameSite=Lax" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: The email is already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in. The response sets the `token` cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Wrong email or password (the message doesn't say which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { message: Incorrect email or password. } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Clears the `token` cookie. Safe to call when already logged out.
      operationId: logout
      security: []
      responses:
        "204": { description: Logged out. }

  /auth/me:
    get:
      tags: [Account]
      summary: Get the logged-in user
      operationId: getCurrentUser
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    patch:
      tags: [Account]
      summary: Update the logged-in user's details
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                phone: { type: string, description: "Bangladeshi mobile number, or empty to clear it" }
            example: { name: Wakil Israk Abir, email: abir@example.com, phone: "01712-345678" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Another account already uses the email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me/password:
    patch:
      tags: [Account]
      summary: Change the password
      description: Logs out every other session and sets a fresh `token` cookie for this one.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password changed.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Always answers 204, whether or not the email has an account, so the endpoint
        can't be used to find registered emails. The link expires in 30 minutes.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: "If the account exists, the email is on its way." }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password from an emailed link
      description: The link works once. Other sessions are logged out and this one is logged in.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string, pattern: "^[a-f0-9]{64}$" }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password changed and logged in. The response sets the `token` cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: The token is malformed, expired or already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /health:
    get:
      tags: [Health]
      summary: Check the API and database are up
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [connected, disconnected] }
              example: { status: ok, database: connected }

  /calls:
    post:
      tags: [Calls]
      summary: Log a call
      description: Only `mobile` is required. Everything else has a sensible default or is optional.
      operationId: createCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallInput" }
            example:
              mobile: "01712 345678"
              customerId: PZ004182
              area: inventory
              issue: Stock quantity doesn't match shelf
              priority: high
              direction: inbound
              status: pending
              durationSeconds: 225
              outcome: Re-synced stock, waiting for customer to confirm
      responses:
        "201":
          description: The call was logged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Call" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    get:
      tags: [Calls]
      summary: List logged calls
      description: Newest call first. Every filter is optional and they can be combined.
      operationId: listCalls
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: mobile
          in: query
          description: Calls from this number (any common format is accepted).
          schema: { type: string }
          example: "01712345678"
        - name: area
          in: query
          schema: { $ref: "#/components/schemas/ProblemArea" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CallStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/Priority" }
        - name: direction
          in: query
          schema: { $ref: "#/components/schemas/Direction" }
        - name: search
          in: query
          description: Part of a mobile number or transaction no. (case-insensitive).
          schema: { type: string, maxLength: 50 }
          example: "1712"
        - name: from
          in: query
          description: Only calls at or after this moment.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only calls before this moment.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of calls.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Call" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /calls/{id}:
    get:
      tags: [Calls]
      summary: Get one call
      operationId: getCall
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The call.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Calls]
      summary: Update a call
      description: |
        Changes how a call ended up and its notes. Only the agent who logged the call,
        or an admin, can do this. An empty string clears a note.
      operationId: updateCall
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/CallStatus" }
                priority: { $ref: "#/components/schemas/Priority" }
                outcome: { type: string, maxLength: 2000 }
                comments: { type: string, maxLength: 5000 }
            example: { status: under-review, outcome: Sent to the tech team }
      responses:
        "200":
          description: The updated call.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Call" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The call was logged by someone else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    User:
      type: object
      required: [id, name, email, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: "Empty when not set" }
        role: { type: string, enum: [agent, admin] }
        lastLoginAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time, description: "Missing until the password is first changed" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/User" }

    ProblemArea:
      type: string
      description: Which PharmaZ247 module the problem is in.
      enum: [pos, sales, inventory, purchase, appointments, accounting, master-data, setup, access, general]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    Direction:
      type: string
      enum: [inbound, outbound]
    CallStatus:
      type: string
      enum: [completed, pending, resolved, under-review]

    CallInput:
      type: object
      required: [mobile]
      additionalProperties: false
      properties:
        mobile:
          type: string
          description: Bangladeshi mobile number. Spaces, dashes and a +88/88 prefix are accepted and removed.
          example: "+8801712345678"
        customerId: { type: string, maxLength: 50 }
        transactionNo: { type: string, maxLength: 50 }
        area: { $ref: "#/components/schemas/ProblemArea" }
        issue: { type: string, maxLength: 200 }
        priority: { $ref: "#/components/schemas/Priority", default: normal }
        direction: { $ref: "#/components/schemas/Direction", default: inbound }
        status: { $ref: "#/components/schemas/CallStatus", default: pending }
        durationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        calledAt:
          type: string
          format: date-time
          description: When the call happened. Defaults to the time it was logged.
        outcome: { type: string, maxLength: 2000 }
        comments: { type: string, maxLength: 5000 }

    Call:
      type: object
      required: [id, mobile, priority, direction, status, calledAt, createdAt, updatedAt]
      properties:
        id: { type: string, example: 6708f1c2a9b3e4d5f6a7b8c9 }
        mobile: { type: string, description: Always stored as 01XXXXXXXXX., example: "01712345678" }
        customerId: { type: string }
        transactionNo: { type: string }
        area: { $ref: "#/components/schemas/ProblemArea" }
        issue: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        direction: { $ref: "#/components/schemas/Direction" }
        status: { $ref: "#/components/schemas/CallStatus" }
        durationSeconds: { type: integer }
        calledAt: { type: string, format: date-time }
        outcome: { type: string }
        comments: { type: string }
        createdBy:
          type: object
          description: The agent who logged the call.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }

  responses:
    Unauthorized:
      description: Not logged in, or the login has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { message: Please log in to continue. } }
    TooManyRequests:
      description: Too many login or sign-up attempts from this IP. Try again in 15 minutes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The request had invalid values.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              message: Validation failed
              fields:
                mobile: That doesn't look like a valid mobile number.
    NotFound:
      description: Nothing exists at that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              message: Call not found
